# APPLICATION
spring.application.name=nome-applicazione

# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# SERVER
server.port=8080
# Base64 di almeno 32 byte casuali; nessun segreto predefinito.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=spring-course
