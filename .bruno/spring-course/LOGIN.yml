info:
  name: LOGIN
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "admin123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.accessToken) {
          bru.setEnvVar("access_token", res.body.accessToken);
        } else {
          console.error("Get JWT", res.status, res.body);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
